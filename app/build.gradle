plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace "br.com.pdasolucoes.standardconfig"
    compileSdkVersion 36

    defaultConfig {
        useLibrary 'org.apache.http.legacy'
        minSdkVersion 24
        targetSdkVersion 36
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    publishing {
        singleVariant("release")
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.github.MdFarhanRaja:SearchableSpinner:1.9'
    implementation files('libs/ksoap2-android-assembly-3.5.0-jar-with-dependencies.jar')
    implementation 'org.jbundle.util.osgi.wrapped:org.jbundle.util.osgi.wrapped.org.apache.http.client:4.1.2'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.viniciusnovaiis'
                artifactId = 'standardconfig'
                version = '2.1.7'
            }
        }
    }
}

tasks.register('deleteOldJar', Delete) {
    delete 'release/AndroidPlugin.jar'
}
